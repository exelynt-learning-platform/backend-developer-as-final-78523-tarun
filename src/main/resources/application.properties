spring.application.name=resource-booking-api
server.port=${SERVER_PORT:8080}

# ---- Database ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT (the app derives a 512-bit HS512 key from this value) ----
app.jwt.secret=${JWT_SECRET:ChangeThisToANewLongSecretKeyForHS512_1234567890abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- Pagination ----
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method